# Liquid glass: Umbriel's effect presets and the rules that use them. Included
# (optionally) by config.toml and linked as ~/.config/umbriel/glass.toml only
# with my.liquidGlass.enable (modules/umbriel.nix). Included files apply
# before config.toml, so its rules for the same windows still win on any field
# they also set. Needs the patched Umbriel ("backdrop" effect kind).

# Lens edge for the translucent terminals (both already use appOpacity).
[effects.preset.liquid-glass]
kind = "window"
# Absolute: a relative path resolves beside the ~/.config link, not the repo.
shader = "/etc/nixos/home/umbriel/effects/liquid-glass.glsl"

# Glass under the window (patched Umbriel: patches/umbriel-backdrop-effect.patch).
# padding: how far past the window edge the shader may read the backdrop (the
# fold reads inward only; 8 px covers the blur at the edge).
[effects.preset.liquid-glass-backdrop]
kind = "backdrop"
shader = "/etc/nixos/home/umbriel/effects/liquid-glass-backdrop.glsl"
padding = 8

# Alternative glass under the window: liquidglass.dev's refracting lens rim
# (a 42 px bevel bending up to 60 px inward, colour fringe, faint rim light)
# instead of the mirrored fold. To try it, set the catch-all window_rule
# below to backdrop_effect = "liquid-glass-lens".
# padding must cover the farthest read in ANY direction, inward too: it is also
# how far a partial redraw is grown around damage. The lens bends inward up to
# REFRACTION * (1 + CHROMA) px (47 * 1.8 = 85); with only 8, a redraw near the
# edge (a blinking cursor, a hover) let the rim refract last frame's window
# content and flicker. Raise it if the shader's constants grow.
[effects.preset.liquid-glass-lens]
kind = "backdrop"
shader = "/etc/nixos/home/umbriel/effects/liquid-glass-lens.glsl"
padding = 88

# Glass only in the shapes a client names over umbriel_glass_v1
# (patches/umbriel-glass-regions.patch): same optics and constants as
# liquid-glass-lens, per shape. Without shapes it draws nothing.
[effects.preset.liquid-glass-lens-regions]
kind = "backdrop"
shader = "/etc/nixos/home/umbriel/effects/liquid-glass-lens-regions.glsl"
padding = 88

# Glass body for Noctalia's surfaces (layer shapes are unknown, so no rim).
[effects.preset.liquid-glass-layer]
kind = "backdrop"
shader = "/etc/nixos/home/umbriel/effects/liquid-glass-layer.glsl"
padding = 8

[effects.preset.liquid-glass-rim]
kind = "border"
shader = "/etc/nixos/home/umbriel/effects/liquid-glass-rim.glsl"

# Noctalia's surfaces; blur and blur_ignore_alpha are in config.toml.
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
backdrop_effect = "liquid-glass-lens-layer"

# The Vicinae launcher; blur and blur_ignore_alpha are in config.toml.
[[layer_rule]]
match.namespace = "^vicinae$"
backdrop_effect = "liquid-glass-lens-layer"

# Liquid glass behind every window. It is drawn by the window's blur node,
# which exists only while the window is transparent, so opaque windows are
# unaffected.
[[window_rule]]
backdrop_effect = "liquid-glass-lens"

# The terminals' 1 px hairline (config.toml), lit like the glass rim when focused.
[[window_rule]]
match.app_id = "^(com\\.mitchellh\\.ghostty|dev\\.rockorager\\.monstar)$"
border_effect = "liquid-glass-rim"

# Lens glass for layer surfaces (Noctalia, Vicinae): the window lens optics on
# the layer shader's edge search. Set the two layer rules above back to
# "liquid-glass-layer" for the old fold glass.
[effects.preset.liquid-glass-lens-layer]
kind = "backdrop"
shader = "/etc/nixos/home/umbriel/effects/liquid-glass-lens-layer.glsl"
# Inward reach REFRACTION * (1 + CHROMA) = 60 * 1.88 = 113 px (see liquid-glass-lens).
padding = 116

# Vitrum (~/src/vitrum), the umbriel_glass_v1 demo: a frameless, clear window
# whose panels are glass shapes. After the catch-all rule above, so it wins.
[[window_rule]]
match.app_id = "^dev\\.erebor\\.vitrum$"
blur = true
backdrop_effect = "liquid-glass-lens-regions"
border_width = 0
shadow = false
corner_radius = 0
default_floating = true
