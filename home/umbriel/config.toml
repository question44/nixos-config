# Umbriel counterpart to the active Niri keybindings.
# Ctrl+Alt+Super chords are emitted by the existing xremap CapsLock layer.

[general]
autostart = ["noctalia"]

[environment]
QT_QPA_PLATFORMTHEME = "kde"

[input.keyboard]
layout = "pl"
options = "lv3:ralt_switch,moria:launchers"

[workspaces]
back_and_forth = true

[output.DP-1]
mode = "3440x1440@164.899994"
hdr = "on"

[appearance.blur]
radius = 3

[[workspace]]
name = "background-apps"

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false

[[layer_rule]]
match.namespace = "^vicinae$"
blur = true
blur_optimized = false

[[window_rule]]
blur = true
blur_optimized = false

[keybinds]
# Launchers and session controls
"Ctrl+Alt+Super+Insert" = { action = "spawn:/home/janzon/.local/bin/umbriel-hdr-toggle", repeat = false }
"Ctrl+Alt+Super+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Ctrl+Alt+Super+Space" = { action = "spawn:vicinae toggle", repeat = false }
"Mod+Space" = { action = "spawn:vicinae toggle", repeat = false }
"Alt+Space" = { action = "spawn:vicinae toggle", repeat = false }
"Ctrl+Alt+Super+V" = { action = "spawn:vicinae vicinae://launch/clipboard/history", repeat = false }
"Ctrl+Alt+Shift+Super+V" = { action = "spawn:vicinae cmd launch snippets:manage", repeat = false }
"Ctrl+Alt+Super+O" = { action = "spawn:vicinae cmd launch @mattisssa/store.raycast.spotify-player:search", repeat = false }
"Ctrl+Alt+Super+Comma" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Ctrl+Alt+Super+Escape" = { action = "spawn:noctalia msg session logout", repeat = false }
"Ctrl+Alt+Super+X" = { action = "spawn:noctalia msg session lock", repeat = false }
"Ctrl+Alt+Super+Return" = { action = "spawn:helium", repeat = false }
"XF86Terminal" = { action = "spawn:/home/janzon/.local/bin/umbriel-focus-or-launch com.mitchellh.ghostty|ghostty ghostty", repeat = false }
"XF86Launch7" = { action = "spawn:/home/janzon/.local/bin/umbriel-focus-or-launch helium|net.imput.helium helium", repeat = false }
"XF86Explorer" = { action = "spawn:/home/janzon/.local/bin/umbriel-focus-or-launch org.kde.dolphin dolphin", repeat = false }
"XF86Messenger" = { action = "spawn:/home/janzon/.local/bin/umbriel-focus-or-launch discord discord", repeat = false }
"XF86Music" = { action = "spawn:/home/janzon/.local/bin/umbriel-focus-or-launch spotify|com.spotify.Client spotify", repeat = false }
"Mod+T" = { action = "spawn:ghostty", repeat = false }
"Mod+Return" = { action = "spawn:ghostty", repeat = false }
"Mod+D" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Super+Alt+L" = { action = "spawn:noctalia msg session lock", repeat = false }
"Super+Alt+S" = { action = "spawn:sh -c 'pkill orca || exec orca'", repeat = false }

# CapsLock navigation and window management layer
"Ctrl+Alt+Super+T" = "column-toggle-tabbed"
"Ctrl+Alt+Super+W" = "window-focus-up"
"Ctrl+Alt+Super+A" = "window-focus-left"
"Ctrl+Alt+Super+S" = "window-focus-down"
"Ctrl+Alt+Super+D" = "window-focus-right"
"Ctrl+Alt+Shift+Super+W" = "window-move-up"
"Ctrl+Alt+Shift+Super+A" = "column-move-left"
"Ctrl+Alt+Shift+Super+S" = "window-move-down"
"Ctrl+Alt+Shift+Super+D" = "column-move-right"
"Ctrl+Alt+Super+Home" = "column-focus-first"
"Ctrl+Alt+Super+End" = "column-focus-last"
"Ctrl+Alt+Shift+Super+Home" = "column-move-to-first"
"Ctrl+Alt+Shift+Super+End" = "column-move-to-last"
"Ctrl+Alt+Super+Page_Up" = "workspace-previous"
"Ctrl+Alt+Super+Page_Down" = "workspace-next"
"Ctrl+Alt+Shift+Super+Page_Up" = "window-move-to-workspace-previous"
"Ctrl+Alt+Shift+Super+Page_Down" = "window-move-to-workspace-next"
"Ctrl+Alt+Super+Q" = { action = "spawn:/home/janzon/.local/bin/umbriel-caps-q", repeat = false }
"XF86Tools" = { action = "window-focus-right", cooldown_ms = 50 }
"XF86Launch5" = { action = "window-focus-left", cooldown_ms = 50 }
"Ctrl+Alt+Super+C" = "column-center"
"Ctrl+Alt+Super+R" = "window-cycle-primary-extent"
"Ctrl+Alt+Super+F" = { action = "spawn:sh -c 'umbriel msg window-toggle-maximize && sleep 0.3 && umbriel msg column-center'", repeat = false }
"Ctrl+Alt+Super+G" = "window-toggle-fullscreen"
"Ctrl+Alt+Super+E" = "window-set-primary-extent:1.0"
"Ctrl+Alt+Super+B" = "window-toggle-floating"
"Ctrl+Alt+Super+BracketLeft" = "window-consume-or-expel-left"
"Ctrl+Alt+Super+BracketRight" = "window-consume-or-expel-right"
"Ctrl+Alt+Super+Z" = "workspace-previous"
"Ctrl+Alt+Super+Period" = "column-move-to-workspace-next"
"Ctrl+Alt+Super+1" = "workspace-switch:1"
"Ctrl+Alt+Super+2" = "workspace-switch:2"
"Ctrl+Alt+Super+3" = "workspace-switch:3"
"Ctrl+Alt+Super+4" = "workspace-switch:4"
