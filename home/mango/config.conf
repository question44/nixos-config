# Port of home/umbriel/config.toml; differences are documented in README.md.
# Do not source the stale Noctalia-generated monitors.conf: it requests 60Hz/1.5x.
xkb_rules_layout=pl
xkb_rules_options=lv3:ralt_switch
monitor_rule=name:^DP-1$,width:3440,height:1440,refresh:164.899994,x:0,y:0,scale:1,primary:1
monitor_rule=name:^ambilight$,width:3440,height:1440,refresh:30,x:3440,y:0,scale:1
window_rule=app_id:^steam$,title:[Bb]ig [Pp]icture,monitor:sunshine,is_fullscreen:1
window_rule=app_id:^steam_app_,monitor:sunshine
tag_rule=id:*,layout_name:scroller
# Tag zero is the tiled scratchpad; regular navigation remains active.
tag_rule=id:0,layout_name:scroller
scroller_default_proportion=0.5
scroller_proportion_preset=0.333333,0.5,0.666667,1.0
scroller_prefer_center=1
scroller_prefer_overspread=0
blur=1
blur_layer=1
blur_optimized=0
blur_params_radius=3
border_radius=8
border_px=2
focus_on_activate=1
# Modifier mouse dragging is available alongside the existing xremap layer.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

key_mode=default
bind=CTRL+ALT+SUPER,Insert,spawn_shell,mango-action unavailable HDR
bind=CTRL+ALT+SUPER,slash,spawn,mango-action help
