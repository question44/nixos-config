"$schema" = 'https://starship.rs/config-schema.json'
# Layout: the Mac's powerline preset (home/starship-mac.toml), coloured from
# Noctalia's palette, which Home Manager appends as [palettes.noctalia]
# (modules/home/shell.nix). Segment text is `base` (the palette's darkest
# shade) on the light accent colours, and `text` on the dark time segment.
palette = "noctalia"

format = """
[](mauve)\
$os\
$username\
$hostname\
$localip\
[](bg:red fg:mauve)\
$directory\
[](fg:red bg:blue)\
$git_branch\
$git_status\
$git_metrics\
[](fg:blue bg:yellow)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:yellow bg:overlay1)\
$docker_context\
$nix_shell\
$container\
[](fg:overlay1 bg:surface2)\
$time\
[ ](fg:surface2)\
$cmd_duration\
$jobs\
$env_var\
$sudo\
$character"""

[username]
show_always = true
style_user = "bg:mauve fg:base"
style_root = "bg:mauve fg:base bold"
format = '[$user ]($style)'
disabled = false

[hostname]
ssh_only = true
style = "bg:mauve fg:base"
format = '[@$hostname ]($style)'

[localip]
ssh_only = true
style = "bg:mauve fg:base"
format = '[$localipv4 ]($style)'
disabled = false

[os]
style = "bg:mauve fg:base"
disabled = true

[directory]
style = "bg:red fg:base"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = " "
read_only_style = "bg:red fg:base"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:overlay1 fg:base"
format = '[ $symbol $context ]($style)'

[nix_shell]
symbol = ""
style = "bg:overlay1 fg:base"
format = '[ $symbol $state( $name) ]($style)'
impure_msg = "impure"
pure_msg = "pure"
unknown_msg = ""

[container]
symbol = "⬢"
style = "bg:overlay1 fg:base"
format = '[ $symbol $name ]($style)'

[elixir]
symbol = " "
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:blue fg:base"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:blue fg:base"
format = '[$all_status$ahead_behind ]($style)'

[git_metrics]
added_style = "bg:blue fg:base"
deleted_style = "bg:blue fg:base"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'
ignore_submodules = true
disabled = false

[golang]
symbol = " "
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:yellow fg:base"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface2 fg:text"
format = '[ ♥ $time ]($style)'

# Kept from the previous prompt, after the powerline segments.
[cmd_duration]
format = "[$duration ](italic subtext0)"

[jobs]
format = "[$symbol$number]($style) "
style = "text"
symbol = "▶"

[env_var.VIMSHELL]
format = "[$env_value]($style) "
style = "green italic"

[sudo]
format = "[$symbol]($style)"
style = "bold italic magenta"
symbol = "⋈┈"
disabled = false

[character]
format = "$symbol "
success_symbol = "[◎](bold italic bright-yellow)"
error_symbol = "[○](italic purple)"
vimcmd_symbol = "[■](italic dimmed green)"
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"
