[backdrop]
enabled = true

[bar]
order = [ "default", "stats" ]

    [bar.default]
    background_opacity = 0.35
    border = "surface_container"
    capsule = true
    capsule_padding = 8.0
    capsule_radius = 8
    capsule_thickness = 0.82
    center = [ "show_vicinae_button", "taskbar" ]
    contact_shadow = true
    end = [ "tray", "group:g2", "group:g6", "group:g7", "group:g5", "battery", "group:g4", "session" ]
    margin_edge = 4
    margin_ends = 20
    margin_opposite_edge = 4
    position = "bottom"
    radius = 16
    shadow = false
    start = [ "cat", "bar_3", "audio_visualizer", "lyrics_2", "bar-pin", "bar_4" ]
    thickness = 48

        [bar.default.dead_zone.actions]
        back = "media previous"
        forward = "media next"
        left = "exec umbriel msg overview-toggle"
        scroll_down = "exec /home/janzon/.local/bin/noctalia-bar-focus right"
        scroll_left = "workspace-switch prev"
        scroll_right = "workspace-switch next"
        scroll_up = "exec /home/janzon/.local/bin/noctalia-bar-focus left"

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "summary_2", "widget" ]
        opacity = 1.0
        padding = 6.0
        radius = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g2"
        members = [ "widget_2", "clipboard", "launcher_2", "widget_5", "bar_2", "nextboot-selector" ]
        opacity = 1.0
        padding = 6.0
        radius = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g5"
        members = [ "wallpaper", "sequoia-motion", "wallhaven", "wallpaper-engine", "nightlight", "display-switch", "brightness" ]
        opacity = 1.0
        padding = 6.0
        radius = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g6"
        members = [ "network", "status", "bluetooth" ]
        opacity = 1.0
        padding = 6.0
        radius = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g7"
        members = [ "headphone-eq", "volume" ]
        opacity = 1.0
        padding = 6.0
        radius = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g4"
        members = [ "notifications", "clock" ]
        opacity = 1.0
        padding = 8.0
        radius = 8.0

    [bar.stats]
    background_opacity = 0.0
    capsule = true
    capsule_padding = 11.0
    capsule_radius = 6
    capsule_thickness = 0.9
    center = [ "summary_2", "widget", "bar_6" ]
    enabled = true
    end = []
    font_scale = 1.1
    layer = "overlay"
    radius = 15
    reserve_space = false
    smart_auto_hide = true
    start = []

        [bar.stats.dead_zone.actions]
        left = "none"
        right = "none"

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[calendar]
enabled = true

[control_center]
sidebar = "full"

    [[control_center.shortcuts]]
    type = "janzon/toggles:headphone-eq-tile"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "dark_mode"

[dock]
background_opacity = 0.35
border_width = 0.5
enabled = true
icon_size = 42
item_spacing = 8
launcher_position = "start"
pinned = [
    "helium",
    "org.kde.dolphin",
    "com.mitchellh.ghostty",
    "discord",
    "steam"
]
position = "left"
reserve_space = false
shadow = false
show_dots = true
smart_auto_hide = true

# Lower app and surface opacity in light mode (modules/home/theme-opacity.nix).
[hooks]
started = "/etc/profiles/per-user/janzon/bin/erebor-theme-opacity"
theme_mode_changed = "/etc/profiles/per-user/janzon/bin/erebor-theme-opacity"

[hot_corners]
delay_ms = 300
enabled = true

    [hot_corners.bottom_left]
    action = "window_switcher"

    [hot_corners.top_left]
    action = "command"
    command = "umbriel msg overview-toggle"

[location]
auto_locate = true

