
[backdrop]
enabled = true

[bar.default]
background_opacity = 0.72999998368322849
position = "bottom"
border = "surface_variant"
capsule = true
capsule_padding = 8.0
capsule_radius = 8
capsule_thickness = 0.81999998539686203
center = [ "launcher", "taskbar" ]
compositor_blur = true
contact_shadow = true
end = [
    "group:g2",
    "group:g1",
    "tray",
    "notifications",
    "group:g6",
    "volume",
    "group:g5",
    "battery",
    "control-center",
    "clock",
    "session"
]
layer = "overlay"
margin_edge = 4
margin_ends = 20
margin_opposite_edge = 4
radius = 16
start = [ "bar-autohide", "group:g3", "cat", "bar", "lyrics", "audio_visualizer", "lyrics_2" ]
thickness = 48

    [bar.default.dead_zone.actions]
    back = "media previous"
    forward = "media next"
    left = "exec niri msg action toggle-overview"
    scroll_down = "exec /home/janzon/.local/bin/noctalia-bar-focus right"
    scroll_left = "workspace-switch prev"
    scroll_right = "workspace-switch next"
    scroll_up = "exec /home/janzon/.local/bin/noctalia-bar-focus left"

[widget.bar-autohide]
type = "custom_button"
glyph = "layout-sidebar-left-collapse"
tooltip = "Toggle smart bar auto-hide"

    [widget.bar-autohide.actions]
    left = "exec /home/janzon/.local/bin/noctalia-bar-autohide"

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "summary_2", "widget" ]
    opacity = 1.0
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "widget_2", "clipboard", "launcher_2", "widget_5", "bar_2", "nextboot-selector" ]
    opacity = 1.0
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "wallpaper", "wallhaven" ]
    opacity = 1.0
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "nightlight", "brightness" ]
    opacity = 1.0
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
