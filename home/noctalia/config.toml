[notification]
filter_order = [ "claude" ]

    [notification.filter.claude]
    match = "Claude"
    play_sound = false

[osd]
background_opacity = 0.82
border_color = "on_secondary"
orientation = "vertical"
position = "bottom_right"
position_vertical = "bottom_right"

[plugin_settings."avivbintangaringga/nextboot-selector"]
privilege_command = "/run/wrappers/bin/sudo -n"

[plugin_settings."davemhammer/tailscale"]
notify_on_peer_change = false

[plugin_settings."goatnath/spotify-lyrics"]
lyrics-panel_layer = "overlay"
lyrics-panel_open_near_click = true

[plugin_settings."noctalia/wallhaven"]
browser_open_near_click = true

[plugins]
enabled = [
    "davemhammer/tailscale",
    "goatnath/spotify-lyrics",
    "h465855hgg/lyrics",
    "notfinaldev/spotify",
    "felipeartur/ai-usagebar",
    "noctalia/bitwarden",
    "dotnetrob/cat",
    "oldirtty/color_picker",
    "liamwh/emoji-picker",
    "whyoolw/dropwall",
    "alexander/game-launcher",
    "blackbartblues/keymap",
    "notoxus/media-island",
    "tausif/ncs-visualizer",
    "avivbintangaringga/nextboot-selector",
    "mgeldi/pixel-shift",
    "icefish/phone-connect",
    "weinguyen/procmon",
    "tordex/processes",
    "yocraft/qrcode",
    "alexander/screen-toolkit",
    "nilsonlinux/speedtest-meter",
    "tmelik/system-monitor",
    "noctalia/translator",
    "noctalia/wallhaven",
    "notfinaldev/web-search",
    "al3x/visualizerp",
    "question44/spotify-media-niri",
    "tranzem/media-lyrics",
    "noctalia/umbriel-companion",
    "janzon/wallpaper-engine",
    "janzon/toggles"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/question44/spotify-media-niri"
    name = "spotify-media-niri"

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 1.1
external_ip_enabled = true
font_family = "SF Pro"
input_borders = false
launch_apps_as_systemd_services = true
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = true
umbriel_audio_provider_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    pinned = [ "unreal-tournament-2004", "helium" ]
    show_app_actions = true

    [shell.panel]
    border_width = 0.5
    clipboard_placement = "attached"
    floating_layer = "top"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"
    transparency_mode = "soft"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = true
    size = 8

    [shell.screenshot]
    annotate = true
    confirm_region = true
    remember_last_region = true
    skip_annotate_on_copy_save = true

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "command"
        command = "notify-send 'Noctalia' 'Custom session entry'"
        countdown_seconds = 0.0
        enabled = false
        variant = "default"

    [shell.window_switcher]

[theme]
community_palette = "Flexoki"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk4", "ghostty", "kcolorscheme", "qt", "starship", "umbriel" ]
    community_ids = [
        "claude-code",
        "codex",
        "spicetify",
        "spotifast",
        "chromium-based",
        "zen-browser",
        "discord",
        "micro",
        "neovim",
        "vscode",
        "steam",
        "vicinae",
        "fastfetch",
        "bat"
    ]

        # Keep palette colors dynamic; template alpha comes from home/appearance.nix.
        [theme.templates.user.zed]
        enabled = true
        input_path = "/home/janzon/.config/noctalia/templates/zed.json"
        output_path = [ "$XDG_CONFIG_HOME/zed/themes/noctalia.json", "$XDG_CONFIG_HOME/gram/themes/noctalia.json" ]

        # Strata, translucent: both modes rendered with their appOpacity
        # (modules/home/apps.nix); erebor-theme-opacity links the current one.
        [theme.templates.user.strata_dark]
        enabled = true
        input_path = "/home/janzon/.config/noctalia/templates/strata-dark.toml"
        output_path = "$XDG_CONFIG_HOME/strata/noctalia/dark.toml"
        pre_hook = "mkdir -p \"${XDG_CONFIG_HOME:-$HOME/.config}/strata/noctalia\""

        [theme.templates.user.strata_light]
        enabled = true
        input_path = "/home/janzon/.config/noctalia/templates/strata-light.toml"
        output_path = "$XDG_CONFIG_HOME/strata/noctalia/light.toml"
        pre_hook = "mkdir -p \"${XDG_CONFIG_HOME:-$HOME/.config}/strata/noctalia\""

        # Text-console colours (modules/kmscon.nix validates and applies them).
        [theme.templates.user.kmscon]
        enabled = true
        input_path = "/home/janzon/.config/noctalia/templates/kmscon.conf"
        output_path = "/home/janzon/.local/state/kmscon/palette.conf"
        pre_hook = "mkdir -p /home/janzon/.local/state/kmscon"

# Live "sequoia:" wallpaper (modules/sequoia-wallpaper.nix). Set it with
# `noctalia msg wallpaper-set sequoia:`. It is still on the desktop, eases into
# motion on the lock screen (2 s) and coasts to a stop after unlock (~5 s).
[wallpaper.sequoia]
desktop_motion = "still"  # "animated" keeps it moving while unlocked
lock_motion = "animated"
fps = 60                  # cap while locked
desktop_fps = 30          # cap on the desktop when animated
desktop_speed = 0.5       # desktop travel speed (1 = Apple's 300 s loop)

[wallpaper.default]
path = "/home/janzon/Pictures/redhead.png"

[wallpaper.monitors.DP-1]
path = "/home/janzon/Pictures/redhead.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/janzon/Pictures/redhead.png"

# Umbriel's dedicated virtual output for HyperHDR. Keep this in sync with the
# physical display so the ambilight reflects only the wallpaper.
[wallpaper.monitors.ambilight]
path = "/home/janzon/Pictures/wallhaven-5ymj95.jpg"

[widget.audio_visualizer]
bands = 64
capsule = true
centered = false
color_2 = "tertiary"
mirrored = false
width = 128

[widget.bar_2]
type = "icefish/phone-connect:bar"

[widget.bar_3]
type = "question44/spotify-media-niri:bar"

[widget.bar_4]
type = "noctalia/umbriel-companion:bar"

[widget.bar_6]
type = "felipeartur/ai-usagebar:bar"

[widget.bar-pin]
type = "janzon/toggles:bar-pin"

[widget.headphone-eq]
type = "janzon/toggles:headphone-eq"

[widget.cat]
poll_interval = 1
type = "dotnetrob/cat:cat"
walk_threshold = 10

[widget.clock]
capsule = true
color = "secondary"
font_scale = 1.49
format = "{:%H:%M} \\n{:%d}.{:%m}.{:%Y}"

# The bar is on every output, so this stays reachable on whichever screen is on.
[widget.display-switch]
glyph = "device-desktop"
tooltip = "Switch screen (DP-1 / HDMI)"
type = "custom_button"

    [widget.display-switch.actions]
    left = "exec /etc/profiles/per-user/janzon/bin/umbriel-display-mode toggle"

[widget.launcher_2]
type = "alexander/game-launcher:launcher"

[widget.lyrics_2]
active_color = "on_primary"
anchor = true
capsule = true
capsule_fill = "#1DB954"
capsule_foreground = "on_secondary"
capsule_opacity = 0.81
hide_when_no_lyrics = true
hide_when_paused = true
inactive_color = "outline_variant"
scroll_mode = "static"
secondary_line_mode = "romanization"
show_artist = false
show_glyph = false
type = "h465855hgg/lyrics:lyrics"

[widget.network]
show_label = false

[widget.nextboot-selector]
type = "avivbintangaringga/nextboot-selector:nextboot-selector"

[widget.notifications]
hide_when_no_unread = true

[widget.show_vicinae_button]
glyph = "search"
tooltip = "Show Vicinae"
type = "custom_button"

    [widget.show_vicinae_button.actions]
    left = "exec vicinae toggle"

[widget.sequoia-motion]
type = "janzon/toggles:sequoia-motion"

[widget.status]
type = "davemhammer/tailscale:status"

[widget.summary_2]
hide_unavailable = true
show_cpu_details_in_tooltip = true
show_disk = false
show_download = false
show_gpu_usage = "on"
show_gpu_vram = "off"
show_swap = false
show_upload = false
type = "tmelik/system-monitor:summary"

[widget.sysmon]
enabled = false

[widget.taskbar]
capsule = true
capsule_border_width = 8.0
capsule_opacity = 1.0
capsule_radius = "auto"
group_by_workspace = true
icon_scale = 2.0
minimal = true
pinned = [ "org.kde.dolphin", "helium", "zen" ]
show_window_title = true
workspace_label_placement = "inside"

[widget.tray]
drawer = false
hidden = [ "vicinae" ]

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.wallpaper-engine]
type = "janzon/wallpaper-engine:wallpaper-engine"

[widget.widget]
type = "tordex/processes:widget"

[widget.widget_2]
type = "oldirtty/color_picker:widget"

[widget.widget_5]
type = "yocraft/qrcode:widget"
