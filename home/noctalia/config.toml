    "tmelik/system-monitor",
    "noctalia/translator",
    "noctalia/wallhaven",
    "notfinaldev/web-search",
    "al3x/visualizerp"
]

[shell]
button_borders = false
card_borders = false
font_family = "SF Pro"
input_borders = false
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"

[shell.greeter_sync]
auto_sync = true

[shell.screen_corners]
enabled = true
size = 8
telemetry_enabled = true

    [shell.launcher]
    pinned = [ "unreal-tournament-2004" ]
    show_app_actions = true

    [shell.panel]
    clipboard_placement = "attached"
    floating_layer = "top"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screenshot]
    annotate = true
    confirm_region = true
    remember_last_region = true
    skip_annotate_on_copy_save = true

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "command"
        command = "notify-send 'Noctalia' 'Custom session entry'"
        countdown_seconds = 0.0
        enabled = false
        variant = "default"

    [shell.window_switcher]
    style = "compact"

[theme]
community_palette = "Flexoki"
mode = "dark"
shell_mode = "auto"
source = "community"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "cava", "gtk4", "ghostty", "kcolorscheme", "niri", "starship" ]
    community_ids = [
        "claude-code",
        "codex",
        "spicetify",
        "spotifast",
        "brave",
        "brave-origin",
        "zen-browser",
        "discord",
        "micro",
        "neovim",
        "vscode",
        "zed",
        "steam",
        "vicinae",
        "fastfetch",
        "bat",
        "konsole"
    ]

[wallpaper.default]
path = "/home/janzon/Pictures/redhead.png"

[wallpaper.last]
path = "/home/janzon/Pictures/redhead.png"

[wallpaper.monitors.DP-1]
path = "/home/janzon/Pictures/redhead.png"

# Umbriel's dedicated virtual output for HyperHDR. Keep this in sync with the
# physical display so the ambilight reflects only the wallpaper.
[wallpaper.monitors.ambilight]
path = "/home/janzon/Pictures/redhead.png"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/janzon/Pictures/wallhaven-473895.jpg"
theme_mode = "dark"
wallpaper_scheme = "m3-tonal-spot"

[[wallpaper.favorite]]
path = "/home/janzon/Pictures/redhead.png"

[widget.audio_visualizer]
bands = 64
capsule = true
centered = false
color_2 = "tertiary"
mirrored = false
width = 128

[widget.bar]
type = "question44/spotify-media-niri:bar"

[widget.bar_2]
type = "icefish/phone-connect:bar"

[widget.cat]
poll_interval = 1
type = "dotnetrob/cat:cat"
walk_threshold = 10

[widget.clock]
capsule = true
color = "secondary"
font_scale = 1.49
format = "{:%H:%M} \\n{:%d}.{:%m}.{:%Y}"

[widget.launcher]
capsule = true
capsule_padding = 12

[widget.launcher_2]
type = "alexander/game-launcher:launcher"

[widget.lyrics]
type = "goatnath/spotify-lyrics:lyrics"

[widget.lyrics_2]
active_color = "primary"
capsule = true
capsule_fill = "#AF9CB1"
capsule_opacity = 0.0
hide_when_no_lyrics = true
hide_when_paused = true
scroll_mode = "static"
secondary_line_mode = "romanization"
show_artist = false
show_glyph = false
type = "h465855hgg/lyrics:lyrics"

[widget.media_lyrics]
show_lyric_line = true
type = "tranzem/media-lyrics:now-playing"

[widget.nextboot-selector]
type = "avivbintangaringga/nextboot-selector:nextboot-selector"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.preview]
max_output_length = 233
normal_color = "on_primary"
type = "teagar/niri-workspace-preview:preview"
window_gap = 0

[widget.summary_2]
hide_unavailable = true
show_cpu_details_in_tooltip = true
show_disk = false
show_download = false
show_gpu_usage = "on"
show_gpu_vram = "off"
show_swap = false
show_upload = false
type = "tmelik/system-monitor:summary"

[widget.sysmon]
enabled = false

[widget.taskbar]
capsule = true
capsule_border_width = 8.0
capsule_opacity = 0.0
capsule_radius = "auto"
group_by_workspace = true
icon_scale = 2.0
minimal = true
pinned = [ "org.kde.dolphin", "helium", "zen", "com.spotify.Client" ]
show_window_title = true
workspace_label_placement = "inside"

[widget.tray]
drawer = true
hidden = [ "vicinae" ]

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
type = "tordex/processes:widget"

[widget.widget_2]
type = "oldirtty/color_picker:widget"

[widget.widget_3]
type = "liamwh/emoji-picker:widget"

[widget.widget_5]
type = "yocraft/qrcode:widget"

[widget.workspaces]
label_source = "name"
style = "minimal"
