    enabled = true
    fill = "surface_variant"
    id = "g6"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0
    radius = 8.0

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[calendar]
enabled = true

[control_center]
sidebar = "full"
sidebar_section = "full"

[dock]
background_opacity = 0.79999998211860657
position = "left"
border_width = 0.5
enabled = true
icon_size = 42
item_spacing = 8
pinned = [ "com.spotify.Client", "helium", "t3_code_alpha" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
background_opacity = 0.81999998167157173
border_color = "on_secondary"
orientation = "vertical"
position = "bottom_left"
position_vertical = "top_left"

[plugin_settings."avivbintangaringga/nextboot-selector"]
privilege_command = "/run/wrappers/bin/sudo -n"

[plugin_settings."goatnath/spotify-lyrics"]
lyrics-panel_layer = "overlay"
lyrics-panel_open_near_click = true

[plugins]
enabled = [
    "davemhammer/tailscale",
    "goatnath/spotify-lyrics",
    "h465855hgg/lyrics",
    "tranzem/media-lyrics",
    "question44/spotify-media-niri",
    "notfinaldev/spotify",
    "felipeartur/ai-usagebar",
    "noctalia/bitwarden",
    "dotnetrob/cat",
    "oldirtty/color_picker",
    "liamwh/emoji-picker",
    "whyoolw/dropwall",
    "alexander/game-launcher",
    "blackbartblues/keymap",
    "notoxus/media-island",
    "tausif/ncs-visualizer",
    "avivbintangaringga/nextboot-selector",
    "teagar/niri-workspace-preview",
    "mgeldi/pixel-shift",
