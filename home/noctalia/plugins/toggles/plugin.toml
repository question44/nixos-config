# Bar buttons whose glyph follows a shell setting. Each reads the setting with
# noctalia.getSetting, so Noctalia calls onConfigChanged when it changes (also
# when another tool edits the settings override), and the glyph follows.

id = "janzon/toggles"
name = "Toggles"
version = "1.0.0"
plugin_api = 43
author = "janzon"
license = "MIT"
tags = ["bar"]
icon = "toggle-right"
description = "Stateful toggles: Sequoia wallpaper motion, bar pinning and headphone EQ."

# Sequoia wallpaper on the desktop: animated or still.
[[widget]]
id = "sequoia-motion"
entry = "sequoia_motion.luau"

# Default bar: pinned or smart auto-hide (noctalia-bar-autohide).
[[widget]]
id = "bar-pin"
entry = "bar_pin.luau"

# Headphone EQ (my.headphoneEq): default output is a preset's EQ sink or the
# plain DAC. The service polls `headphone-eq status`; the tile and bar widget
# open the panel (preset picker) and toggle on right-click.
[[service]]
id = "headphone-eq-state"
entry = "headphone_eq_service.luau"

[[widget]]
id = "headphone-eq"
entry = "headphone_eq_widget.luau"

# Entry ids are unique across kinds, so the tile has its own.
[[shortcut]]
id = "headphone-eq-tile"
entry = "headphone_eq_shortcut.luau"

[[panel]]
id = "eq"
entry = "headphone_eq_panel.luau"
width = 300
height = "content"
max_height = 240
placement = "attached"
position = "auto"
open_near_click = true
