virtual_modifiers:
  - CapsLock

modmap:
  - name: CapsLock shortcut layer with double-tap lock
    remap:
      CapsLock:
        held: CapsLock
        alone: BTN_TRIGGER_HAPPY1
        free_hold: true

keymap:
  - name: Double-tap CapsLock
    remap:
      BTN_TRIGGER_HAPPY1:
        remap:
          BTN_TRIGGER_HAPPY1: CapsLock
        timeout_millis: 300

  - name: Right Control app initials
    exact_match: true
    remap:
      Ctrl_R-a:
        launch: ["/home/janzon/.local/bin/rcmd", "a"]
      Ctrl_R-Shift-a:
        launch: ["/home/janzon/.local/bin/rcmd", "a", "--reverse"]
      Ctrl_R-Alt-a:
        launch: ["/home/janzon/.local/bin/rcmd", "a", "--choose"]
